<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, user-scalable=yes, initial-scale=1, maximum-scale=1" />
  <title>getUserMedia — WebRTC Reference</title>
  <style>
    body {
      font-family: 'Roboto', sans-serif;
      font-weight: 300;
      margin: 0;
      padding: 1em;
      word-break: break-word;
      background: #ffffff;
      color: #222222;
    }
    div#container {
      margin: 0 auto;
      max-width: 60em;
      padding: 1em 1.5em 1.3em 1.5em;
    }
    h1 {
      border-bottom: 1px solid #ccc;
      font-weight: 500;
      margin: 0 0 0.8em 0;
      padding: 0 0 0.2em 0;
      font-size: 1.5em;
    }
    video {
      background: #222;
      margin: 0 0 20px 0;
      width: 100%;
      max-width: 640px;
      display: block;
    }
    button {
      background-color: #d84a38;
      border: none;
      border-radius: 2px;
      color: white;
      font-size: 0.9em;
      margin: 0 0 1em 0;
      padding: 0.6em 1em;
      cursor: pointer;
    }
    button:hover {
      background-color: #cf402f;
    }
    button:disabled {
      background-color: #ccc;
      cursor: default;
    }
    div#errorMsg {
      color: #b91c1c;
      font-size: 0.95em;
    }
  </style>
</head>
<body>
  <div id="container">
    <h1><span>WebRTC samples</span> <span>getUserMedia</span></h1>

    <video id="gum-local" autoplay playsinline></video>
    <button id="showVideo" type="button">Open camera</button>

    <div id="errorMsg"></div>

    <p>Display the video stream from <code>getUserMedia()</code> in a video element.</p>
    <p>The <code>MediaStream</code> object <code>stream</code> passed to the <code>getUserMedia()</code> callback is in global scope, so you can inspect it from the console.</p>
  </div>

  <script src="https://webrtc.github.io/adapter/adapter-latest.js"></script>
  <script>
    /*
     *  Copyright (c) 2015 The WebRTC project authors. All Rights Reserved.
     *
     *  Use of this source code is governed by a BSD-style license
     *  that can be found in the LICENSE file in the root of the source
     *  tree.
     */
    'use strict';

    // Put variables in global scope to make them available to the browser console.
    const constraints = (window.constraints = {
      audio: false,
      video: true
    });

    function handleSuccess(stream) {
      const video = document.querySelector('video');
      const videoTracks = stream.getVideoTracks();
      console.log('Got stream with constraints:', constraints);
      console.log(`Using video device: ${videoTracks[0].label}`);
      window.stream = stream; // make variable available to browser console
      video.srcObject = stream;
    }

    function handleError(error) {
      if (error.name === 'OverconstrainedError') {
        const v = constraints.video;
        errorMsg(
          `The resolution ${v.width && v.width.exact}x${v.height && v.height.exact} px is not supported by your device.`
        );
      } else if (error.name === 'NotAllowedError') {
        errorMsg(
          'Permissions have not been granted to use your camera and ' +
            'microphone, you need to allow the page access to your devices in ' +
            'order for the demo to work.'
        );
      }
      errorMsg(`getUserMedia error: ${error.name}`, error);
    }

    function errorMsg(msg, error) {
      const errorElement = document.querySelector('#errorMsg');
      errorElement.innerHTML += `<p>${msg}</p>`;
      if (typeof error !== 'undefined') {
        console.error(error);
      }
    }

    async function init(e) {
      try {
        const stream = await navigator.mediaDevices.getUserMedia(constraints);
        handleSuccess(stream);
        e.target.disabled = true;
      } catch (e) {
        handleError(e);
      }
    }

    document.querySelector('#showVideo').addEventListener('click', (e) => init(e));
  </script>
</body>
</html>
