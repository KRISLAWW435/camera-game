<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebRTC getUserMedia — Simple Camera Test</title>
    <style>
      body {
        margin: 0;
        padding: 24px;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f4f6f8;
        color: #0f172a;
      }
      .container {
        max-width: 720px;
        margin: 0 auto;
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        padding: 20px;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 18px;
      }
      .controls {
        display: flex;
        gap: 10px;
        margin-bottom: 16px;
      }
      button {
        padding: 9px 16px;
        font-size: 14px;
        font-weight: 600;
        border-radius: 8px;
        border: 1px solid #cbd5e1;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      #showVideo {
        background: #059669;
        border-color: #059669;
        color: #ffffff;
      }
      #stopVideo {
        background: #ffffff;
        color: #0f172a;
      }
      video {
        display: block;
        width: 100%;
        max-width: 640px;
        aspect-ratio: 4 / 3;
        background: #020617;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        object-fit: cover;
      }
      #errorMsg {
        margin-top: 12px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 12px;
        color: #b91c1c;
      }
      #diagLog {
        margin-top: 12px;
        padding: 10px;
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 8px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 12px;
        color: #334155;
        white-space: pre-line;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>getUserMedia (WebRTC Samples style)</h1>

      <div class="controls">
        <button id="showVideo" type="button">Включить камеру</button>
        <button id="stopVideo" type="button" disabled>Stop</button>
      </div>

      <video id="gum-local" autoplay playsinline></video>

      <div id="errorMsg"></div>
      <div id="diagLog">Ожидание запуска...</div>
    </div>

    <script>
      'use strict';

      const constraints = (window.constraints = {
        audio: false,
        video: true,
      });

      const video = document.querySelector('video');
      const showBtn = document.querySelector('#showVideo');
      const stopBtn = document.querySelector('#stopVideo');
      const errorElement = document.querySelector('#errorMsg');
      const diagLog = document.querySelector('#diagLog');

      function appendDiag(text) {
        if (diagLog.textContent === 'Ожидание запуска...') {
          diagLog.textContent = text;
        } else {
          diagLog.textContent += '\n' + text;
        }
      }

      function handleSuccess(stream) {
        const videoTracks = stream.getVideoTracks();
        window.stream = stream;
        video.srcObject = stream;

        showBtn.disabled = true;
        stopBtn.disabled = false;
        appendDiag(
          'getUserMedia success | device: ' +
            (videoTracks[0] ? videoTracks[0].label : 'unknown')
        );
      }

      function handleError(error) {
        if (error.name === 'OverconstrainedError') {
          errorMsg(
            'OverconstrainedError: ' +
              (error.constraint || '') +
              ' — ' +
              error.message
          );
        } else if (error.name === 'NotAllowedError') {
          errorMsg(
            'NotAllowedError: доступ к камере запрещён — ' + error.message
          );
        } else {
          errorMsg('getUserMedia error [' + error.name + ']: ' + error.message);
        }
      }

      function errorMsg(msg) {
        errorElement.textContent = msg;
      }

      function stopStream() {
        if (window.stream) {
          window.stream.getTracks().forEach((track) => track.stop());
          window.stream = null;
        }
        video.srcObject = null;
        showBtn.disabled = false;
        stopBtn.disabled = true;
        appendDiag('Stop: все дорожки освобождены');
      }

      video.addEventListener('loadedmetadata', () => {
        appendDiag(
          'event: loadedmetadata | ' +
            video.videoWidth +
            '×' +
            video.videoHeight +
            ' | readyState=' +
            video.readyState
        );
      });

      video.addEventListener('playing', () => {
        appendDiag(
          'event: playing | ' +
            video.videoWidth +
            '×' +
            video.videoHeight +
            ' | readyState=' +
            video.readyState
        );
      });

      async function init() {
        if (window.stream) {
          return;
        }
        errorElement.textContent = '';
        diagLog.textContent = 'Запрос getUserMedia({ audio: false, video: true })...';

        try {
          const stream = await navigator.mediaDevices.getUserMedia(constraints);
          handleSuccess(stream);
        } catch (e) {
          handleError(e);
        }
      }

      showBtn.addEventListener('click', init);
      stopBtn.addEventListener('click', stopStream);
    </script>
  </body>
</html>
